name: Game regression tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax and gameplay tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check js/engine.js
          node --check js/ui.js
          node --check js/ro_map.js
          node --check js/ro_water.js
          node --check js/exploration.js
          node --check tools/test.js
          node --check tools/test_ro_map.js
          node --check tools/test_ro_water.js
          node --check tools/test_exploration.js

      - name: Run complete gameplay regression suite
        run: node tools/test.js
