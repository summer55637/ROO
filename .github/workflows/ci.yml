name: ROO regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roo-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check changed runtime scripts
        run: |
          node --check js/ui.js
          node --check js/ro_prontera_3d.js
          node --check js/ro_water.js
          node --check tools/test.js
          node --check tools/test_ro_prontera.js

      - name: Run gameplay regression suite
        run: node tools/test.js
