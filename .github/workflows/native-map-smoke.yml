name: Native map live smoke

on:
  push:
    branches:
      - feature/exploration-movement-controls
    paths:
      - 'tools/ro_map_assets.mjs'
      - 'tools/test_ro_map_remote.mjs'
      - '.github/workflows/native-map-smoke.yml'

permissions:
  contents: read

concurrency:
  group: native-map-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check native map parser syntax
        run: |
          node --check tools/ro_map_assets.mjs
          node --check tools/test_ro_map_remote.mjs
      - name: Validate real public maps and ground textures
        run: node tools/test_ro_map_remote.mjs
