<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROO 地圖座標校對工具</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; background: #0b111b; color: #e5edf7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 12px 16px; background: #111b2a; border-bottom: 1px solid #2b3a4f; }
    .brand { margin-right: auto; min-width: 180px; }
    .brand strong { display: block; font-size: 15px; }
    .brand span, .hint, footer { color: #9eafc5; font-size: 12px; }
    label { display: flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
    input[type="file"] { max-width: 220px; font-size: 12px; }
    input[type="range"] { width: 90px; }
    input[type="number"] { width: 76px; }
    input[type="checkbox"] { accent-color: #63b3ed; }
    #stage { flex: 1; min-height: 360px; position: relative; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; top: 12px; left: 12px; z-index: 2; max-width: min(620px, calc(100% - 24px)); padding: 9px 12px; border: 1px solid #364a63; border-radius: 8px; background: rgba(7, 13, 22, .86); color: #d9e7f8; font-size: 12px; line-height: 1.5; white-space: pre-line; pointer-events: none; }
    #status.error { color: #fecaca; border-color: #9f4141; }
    #stats { position: absolute; right: 12px; bottom: 12px; z-index: 2; padding: 8px 10px; border: 1px solid #364a63; border-radius: 8px; background: rgba(7, 13, 22, .86); color: #cbd8e8; font-size: 12px; line-height: 1.6; pointer-events: none; }
    footer { padding: 8px 16px; border-top: 1px solid #273549; }
    @media (max-width: 700px) {
      header { align-items: flex-start; }
      .brand { width: 100%; }
      input[type="file"] { max-width: 160px; }
      #stage { min-height: 60vh; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <strong>ROO 地圖座標校對</strong>
      <span>開發用工具，不會加入遊戲執行依賴</span>
    </div>
    <label>地圖 GLB <input id="model-file" type="file" accept=".glb,model/gltf-binary"></label>
    <label>地圖 GAT <input id="gat-file" type="file" accept=".gat"></label>
    <label>世界比例 <input id="world-scale" type="number" min="0.01" max="10" step="0.01" value="0.2" inputmode="decimal"></label>
    <label>透明度 <input id="grid-opacity" type="range" min="10" max="85" value="55"></label>
    <label><input id="show-walkable" type="checkbox" checked>可走格</label>
    <label><input id="show-blocked" type="checkbox" checked>障礙格</label>
  </header>
  <main id="stage">
    <div id="status">載入同一張地圖的 GLB 與 GAT，檔名必須相同。
建議 ragx 使用 --format glb --world-scale 0.2，世界比例也設為 0.2。</div>
    <div id="stats">尚未載入地圖</div>
  </main>
  <footer>滑鼠拖曳旋轉、滾輪縮放；紅色為阻擋格、綠色為可走格、橘色為懸崖、藍色為水域。地圖名稱不一致時會停止疊圖。此工具不代表遊戲已啟用碰撞。</footer>
  <script type="module" src="./map_preview.mjs"></script>
</body>
</html>
