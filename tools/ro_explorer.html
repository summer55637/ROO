<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROO 真實地圖探索原型</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; background: #090f18; color: #e4edf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; background: #111b2a; border-bottom: 1px solid #2b3a4f; }
    .brand { min-width: 210px; margin-right: auto; }
    .brand strong { display: block; font-size: 16px; }
    .brand span, .hint, footer { color: #9eafc5; font-size: 12px; line-height: 1.5; }
    label { display: flex; align-items: center; gap: 7px; font-size: 12px; }
    input[type="file"] { width: 170px; max-width: 32vw; font-size: 12px; }
    input[type="number"] { width: 72px; }
    input[type="range"] { width: 90px; }
    input[type="checkbox"] { accent-color: #48d597; }
    button { border: 1px solid #526985; border-radius: 7px; padding: 7px 10px; background: #1a2a3e; color: #e4edf8; cursor: pointer; font: inherit; font-size: 12px; }
    button:hover { background: #263e59; }
    #stage { flex: 1; min-height: 420px; height: calc(100vh - 140px); position: relative; overflow: hidden; touch-action: pan-y; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; top: 12px; left: 12px; z-index: 2; max-width: min(660px, calc(100% - 24px)); padding: 10px 12px; border: 1px solid #364a63; border-radius: 8px; background: rgba(7, 13, 22, .9); color: #d9e7f8; font-size: 12px; line-height: 1.5; white-space: pre-line; pointer-events: none; }
    #status.error { color: #fecaca; border-color: #9f4141; }
    #stats { position: absolute; right: 12px; bottom: 12px; z-index: 2; max-width: min(360px, calc(100% - 24px)); padding: 9px 11px; border: 1px solid #364a63; border-radius: 8px; background: rgba(7, 13, 22, .9); color: #cbd8e8; font-size: 12px; line-height: 1.6; white-space: pre-line; pointer-events: none; }
    footer { padding: 8px 16px; border-top: 1px solid #273549; }
    a { color: #8cc8ff; }
    @media (max-width: 700px) {
      header { align-items: flex-start; }
      .brand { width: 100%; }
      input[type="file"] { width: 145px; max-width: 44vw; }
      #stage { height: 65vh; min-height: 360px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <strong>🧭 ROO 真實地圖探索</strong>
      <span>實驗原型：3D 地圖、點擊行走、GAT 障礙碰撞、A* 尋路</span>
    </div>
    <label>地圖 GLB <input id="model-file" type="file" accept=".glb,model/gltf-binary"></label>
    <label>地圖 GAT <input id="gat-file" type="file" accept=".gat"></label>
    <label>世界比例 <input id="world-scale" type="number" min="0.01" max="10" step="0.01" value="0.2" inputmode="decimal"></label>
    <label>速度 <input id="move-speed" type="range" min="1" max="8" value="4"><span id="speed-value">4</span></label>
    <label><input id="show-cells" type="checkbox">顯示通行格</label>
    <button id="recenter" type="button">重置視角</button>
  </header>
  <main id="stage">
    <div id="status">選取同一張 RO 地圖的 GLB 與 GAT。建議使用 ragx 轉換：<br>
ragx maps prontera --client "C:/Gravity/Ragnarok" --format glb --world-scale 0.2 --out ./tmp/roo-map<br>
先選 GLB，再選相同地圖的原始 GAT。點擊地面行走；拖曳旋轉視角、滾輪縮放。</div>
    <div id="stats">尚未載入地圖</div>
  </main>
  <footer>
    素材只在你的瀏覽器本機讀取，不會上傳。地圖與角色位置不會寫回原遊戲存檔；探索位置只存於此瀏覽器。
    <a href="https://github.com/joaopedrosgs/ragx" target="_blank" rel="noopener noreferrer">ragx 轉換工具</a>
  </footer>
  <script src="../js/map_pathfinding.js"></script>
  <script type="module" src="./ro_explorer.mjs"></script>
</body>
</html>
